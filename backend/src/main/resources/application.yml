server:
  port: ${PORT:8080}         # 배포 서버(Render 등)는 PORT 환경변수로 포트를 지정한다. 로컬은 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true      # JS에서 세션 쿠키 접근 불가 (XSS로 세션 탈취 방지)
        same-site: lax       # 다른 사이트에서 보낸 요청엔 쿠키 미전송 (CSRF 완화)
        secure: ${COOKIE_SECURE:false} # 배포(https)에서는 true → https 로만 쿠키 전송. 로컬(http)은 false

spring:
  config:
    # DB 접속 정보(DB_HOST, DB_USERNAME, DB_PASSWORD)를 backend/.env 에서 읽는다.
    # .env 는 GitHub 에 올리지 않는다 (.gitignore 에 등록됨). 형식은 .env.example 참고.
    # 실행 위치가 backend 폴더든 프로젝트 최상위 폴더든 찾을 수 있게 두 경로를 모두 적어 둠
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    # Supabase (PostgreSQL) - Session pooler 주소 사용 (IPv4 환경에서도 접속 가능)
    url: jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 무료 플랜은 동시 접속 수가 적어서, 팀원 여러 명이 같이 켜도 넘치지 않게 작게 잡음 (기본값 10)
      maximum-pool-size: 3
      # 우리 테이블은 Data API(REST)로 노출되는 public 대신 app 스키마에 만든다
      connection-init-sql: SET search_path TO app
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
        format_sql: true
        # 연관 엔티티(결재선·인증서·사용자)를 100개씩 묶어서 조회 → 목록·서명 검증 시 쿼리 수(N+1) 감소
        default_batch_fetch_size: 100

app:
  setup:
    # 최초 대표 등록 토큰. 비워 두면 서버가 시작할 때 무작위 토큰을 만들어 터미널에 출력한다.
    # 직접 정하려면 실행 전에 환경변수 CEO_SETUP_TOKEN 을 설정 (PowerShell: $env:CEO_SETUP_TOKEN="원하는값")
    token: ${CEO_SETUP_TOKEN:}
  upload:
    dir: ./uploads          # 결재 첨부파일·메신저 파일(암호문) 저장 폴더
  messenger:
    file-retention-days: 7  # 메신저로 보낸 파일 보관 기간(일). 지나면 자동 삭제
  pki:
    # 사내 인증기관(CA) 개인키를 암호화하는 비밀번호 (backend/.env 의 CA_KEY_PASSWORD).
    # 팀원 모두 같은 값을 써야 한다. 처음 서버를 켤 때 이 값으로 CA 가 만들어진다.
    ca-password: ${CA_KEY_PASSWORD:}
  signature:
    # 전자서명 주기 감사: 상신된 모든 문서의 서명 사슬을 이 간격으로 다시 검증 (밀리초, 기본 30분)
    audit-interval-ms: 1800000
    audit-initial-delay-ms: 120000
